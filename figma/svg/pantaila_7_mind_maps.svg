<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvasGradMap" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="50%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#0D0F13"/>
    </linearGradient>

    <linearGradient id="brandLinearMap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>

    <linearGradient id="nodeRootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <linearGradient id="nodeChildGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232F"/>
      <stop offset="100%" stop-color="#151821"/>
    </linearGradient>

    <filter id="glowNode" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7F52FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Grid dots -->
  <rect id="bgBase" width="1280" height="800" fill="url(#bgCanvasGradMap)"/>

  <!-- Left Sidebar -->
  <g id="sidebarContainer">
    <rect width="250" height="800" fill="#111317" stroke="#1F232B" stroke-width="1"/>
    
    <!-- Brand Header -->
    <g id="brandHeader" transform="translate(18, 20)">
      <rect width="36" height="36" rx="10" fill="url(#brandLinearMap)"/>
      <path d="M14 11L22 18L14 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F0F3F6">LectureSync</text>
      <rect x="135" y="6" width="34" height="18" rx="4" fill="rgba(127, 82, 255, 0.2)"/>
      <text x="142" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#B388FF">AI</text>
      <text x="48" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#717886">Concept Mind Maps</text>
    </g>

    <!-- Navigation Items -->
    <g id="navGroup" transform="translate(14, 126)">
      <text x="8" y="10" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#505663">WORKSPACE</text>

      <g id="btnNavDashboard" transform="translate(0, 20)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Dashboard</text>
      </g>
      <g id="btnNavLive" transform="translate(0, 60)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Live Studio</text>
      </g>
      <g id="btnNavFlashcards" transform="translate(0, 100)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Flashcards &amp; Quizzes</text>
      </g>

      <!-- Active: Concept Maps -->
      <g id="btnNavMindMaps" transform="translate(0, 140)">
        <rect width="222" height="36" rx="8" fill="rgba(127, 82, 255, 0.12)" stroke="rgba(127, 82, 255, 0.25)"/>
        <rect x="0" y="8" width="3" height="20" rx="1.5" fill="#7F52FF"/>
        <circle cx="16" cy="18" r="2.5" fill="#B388FF"/>
        <circle cx="26" cy="12" r="2.5" fill="#B388FF"/>
        <circle cx="26" cy="24" r="2.5" fill="#B388FF"/>
        <line x1="18.5" y1="16.5" x2="23.5" y2="13.5" stroke="#B388FF" stroke-width="1.4"/>
        <line x1="18.5" y1="19.5" x2="23.5" y2="22.5" stroke="#B388FF" stroke-width="1.4"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Concept Mind Maps</text>
      </g>

      <g id="btnNavAudioArchive" transform="translate(0, 180)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Audio Archive</text>
      </g>

      <g id="btnNavSettings" transform="translate(0, 220)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Settings &amp; AI Config</text>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g id="topBar" transform="translate(250, 0)">
    <rect width="1030" height="64" fill="#111317" stroke="#1F232B" stroke-width="1"/>
    <g transform="translate(28, 23)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Maps</text>
      <text x="44" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#505663">/</text>
      <text x="58" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Distributed Systems</text>
      <text x="194" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#505663">/</text>
      <text x="208" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Kotlin Concurrency Graph (AI Extracted)</text>
    </g>

    <!-- Controls on right -->
    <g transform="translate(860, 14)">
      <rect width="130" height="36" rx="6" fill="#7F52FF"/>
      <text x="18" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">+ Add Concept</text>
    </g>
  </g>

  <!-- Mind Map Graph Canvas Area -->
  <g id="mindMapCanvas" transform="translate(270, 84)">
    
    <!-- Curved Connections (Bézier splines) -->
    <path d="M 280 300 C 360 300, 380 180, 480 180" stroke="#7F52FF" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 280 300 C 360 300, 380 300, 480 300" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
    <path d="M 280 300 C 360 300, 380 440, 480 440" stroke="#36D399" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- Sub-connections -->
    <path d="M 660 180 C 710 180, 720 140, 760 140" stroke="#7F52FF" stroke-width="1.8" fill="none" opacity="0.5"/>
    <path d="M 660 180 C 710 180, 720 220, 760 220" stroke="#7F52FF" stroke-width="1.8" fill="none" opacity="0.5"/>

    <path d="M 660 300 C 710 300, 720 280, 760 280" stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.5"/>
    <path d="M 660 300 C 710 300, 720 340, 760 340" stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.5"/>

    <!-- ROOT NODE: Kotlin Coroutines -->
    <g id="nodeRoot" transform="translate(90, 265)" filter="url(#glowNode)">
      <rect width="190" height="70" rx="14" fill="url(#nodeRootGrad)" stroke="#C09CFF" stroke-width="1.5"/>
      <circle cx="28" cy="35" r="14" fill="rgba(255, 255, 255, 0.2)"/>
      <text x="23" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">K</text>
      <text x="52" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Kotlin Coroutines</text>
      <text x="52" y="49" font-family="'Inter', sans-serif" font-size="11" fill="#E8DEF8">KMP Root Architecture</text>
    </g>

    <!-- CHILD NODE 1: Structured Concurrency -->
    <g id="nodeChild1" transform="translate(480, 150)">
      <rect width="180" height="60" rx="10" fill="url(#nodeChildGrad)" stroke="#7F52FF" stroke-width="1.5"/>
      <text x="16" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Structured Concurrency</text>
      <text x="16" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#9DA5B4">Hierarchy &amp; Cancellation</text>
    </g>
    <!-- Leaf 1.1 -->
    <g transform="translate(760, 120)">
      <rect width="150" height="42" rx="8" fill="#161922" stroke="#2B3242"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C09CFF">CoroutineScope</text>
    </g>
    <!-- Leaf 1.2 -->
    <g transform="translate(760, 200)">
      <rect width="150" height="42" rx="8" fill="#161922" stroke="#2B3242"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C09CFF">SupervisorJob</text>
    </g>

    <!-- CHILD NODE 2: Reactive StateFlow (Active/Selected) -->
    <g id="nodeChild2" transform="translate(480, 270)">
      <rect width="180" height="60" rx="10" fill="#1A2838" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="166" cy="14" r="5" fill="#38BDF8"/>
      <text x="16" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Asynchronous Streams</text>
      <text x="16" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#7DD3FC">StateFlow &amp; SharedFlow</text>
    </g>
    <!-- Leaf 2.1 -->
    <g transform="translate(760, 260)">
      <rect width="150" height="42" rx="8" fill="#161922" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7DD3FC">StateFlow (Hot)</text>
    </g>
    <!-- Leaf 2.2 -->
    <g transform="translate(760, 320)">
      <rect width="150" height="42" rx="8" fill="#161922" stroke="#2B3242"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8A92A2">Flow (Cold)</text>
    </g>

    <!-- CHILD NODE 3: UI Dispatchers -->
    <g id="nodeChild3" transform="translate(480, 410)">
      <rect width="180" height="60" rx="10" fill="url(#nodeChildGrad)" stroke="#36D399" stroke-width="1.5"/>
      <text x="16" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Thread Dispatchers</text>
      <text x="16" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#9DA5B4">Main, IO, JavaFx</text>
    </g>
    <g transform="translate(760, 420)">
      <rect width="170" height="42" rx="8" fill="#161922" stroke="#2B3242"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#36D399">Dispatchers.JavaFx</text>
    </g>

    <!-- Selected Node Details Inspector (Right Side) -->
    <g id="nodeInspector" transform="translate(720, 490)">
      <rect width="250" height="190" rx="12" fill="#161920" stroke="#252A35" stroke-width="1"/>
      <text x="16" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F0F3F6">Concept Inspector</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38BDF8">StateFlow&lt;T&gt;</text>
      <text x="16" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#9DA5B4">A state-holder observable flow that emits current and new state updates to its collectors.</text>
      
      <rect x="16" y="104" width="218" height="32" rx="6" fill="#1E2430"/>
      <text x="26" y="124" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C09CFF">Linked: 4 Study Flashcards</text>

      <rect x="16" y="146" width="104" height="28" rx="6" fill="#252A36" stroke="#363E52"/>
      <text x="26" y="164" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Study Cards</text>
    </g>

    <!-- Mini-Map (Bottom Left) -->
    <g id="miniMap" transform="translate(20, 560)">
      <rect width="140" height="110" rx="8" fill="#14171E" stroke="#252A35"/>
      <rect x="10" y="45" width="20" height="10" rx="2" fill="#7F52FF"/>
      <rect x="50" y="25" width="20" height="10" rx="2" fill="#7F52FF"/>
      <rect x="50" y="45" width="20" height="10" rx="2" fill="#38BDF8"/>
      <rect x="50" y="65" width="20" height="10" rx="2" fill="#36D399"/>
      <text x="12" y="100" font-family="'Inter', sans-serif" font-size="10" fill="#505663">100% Zoom</text>
    </g>

  </g>
</svg>
