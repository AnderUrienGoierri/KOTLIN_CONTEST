<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvasGradAudio" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="50%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#0D0F13"/>
    </linearGradient>

    <linearGradient id="brandLinearAudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>

    <linearGradient id="playerBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#36D399"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect id="bgBase" width="1280" height="800" fill="url(#bgCanvasGradAudio)"/>

  <!-- Left Sidebar -->
  <g id="sidebarContainer">
    <rect width="250" height="800" fill="#111317" stroke="#1F232B" stroke-width="1"/>
    
    <!-- Brand Header -->
    <g id="brandHeader" transform="translate(18, 20)">
      <rect width="36" height="36" rx="10" fill="url(#brandLinearAudio)"/>
      <path d="M14 11L22 18L14 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="18" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F0F3F6">LectureSync</text>
      <rect x="135" y="6" width="34" height="18" rx="4" fill="rgba(127, 82, 255, 0.2)"/>
      <text x="142" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#B388FF">AI</text>
      <text x="48" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#717886">Audio Library</text>
    </g>

    <!-- Navigation Items -->
    <g id="navGroup" transform="translate(14, 126)">
      <text x="8" y="10" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#505663">WORKSPACE</text>

      <g id="btnNavDashboard" transform="translate(0, 20)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Dashboard</text>
      </g>
      <g id="btnNavLive" transform="translate(0, 60)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Live Studio</text>
      </g>
      <g id="btnNavFlashcards" transform="translate(0, 100)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Flashcards &amp; Quizzes</text>
      </g>
      <g id="btnNavMindMaps" transform="translate(0, 140)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Concept Maps</text>
      </g>

      <!-- Active: Audio Archive -->
      <g id="btnNavAudioArchive" transform="translate(0, 180)">
        <rect width="222" height="36" rx="8" fill="rgba(127, 82, 255, 0.12)" stroke="rgba(127, 82, 255, 0.25)"/>
        <rect x="0" y="8" width="3" height="20" rx="1.5" fill="#7F52FF"/>
        <path d="M14 14H24M14 18H24M14 22H20" stroke="#B388FF" stroke-width="1.8" stroke-linecap="round"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Audio Archive</text>
      </g>

      <g id="btnNavSettings" transform="translate(0, 220)">
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Settings &amp; AI Config</text>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g id="topBar" transform="translate(250, 0)">
    <rect width="1030" height="64" fill="#111317" stroke="#1F232B" stroke-width="1"/>
    <g transform="translate(28, 23)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Archive</text>
      <text x="56" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#505663">/</text>
      <text x="70" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Classroom Audio Recordings (41.5 Hours)</text>
    </g>
  </g>

  <!-- Main Content Layout -->
  <g id="archiveContent" transform="translate(280, 84)">
    
    <!-- Top Audio Player Card (Active Playback) -->
    <g id="cardActivePlayer">
      <rect width="970" height="150" rx="16" fill="#161922" stroke="#252A36" stroke-width="1.5"/>

      <!-- Track Info -->
      <g transform="translate(24, 24)">
        <rect width="48" height="48" rx="12" fill="#7F52FF"/>
        <path d="M22 18L30 24L22 30V18Z" fill="#FFFFFF"/>
        
        <text x="64" y="22" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Kotlin Multiplatform Concurrency &amp; StateFlow</text>
        <text x="64" y="42" font-family="'Inter', sans-serif" font-size="12" fill="#8A92A2">Prof. Martinez · Recorded Today 10:14 AM · 48kHz Opus Audio</text>
      </g>

      <!-- Waveform Scrubbing Bar -->
      <g transform="translate(24, 88)">
        <rect width="920" height="8" rx="4" fill="#252A36"/>
        <rect width="320" height="8" rx="4" fill="url(#playerBarGrad)"/>
        <!-- Scrub Head -->
        <circle cx="320" cy="4" r="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="3"/>

        <!-- Playback Time Labels -->
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">00:24:18</text>
        <text x="860" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717886">01:14:20</text>
      </g>

      <!-- Playback Speed & Controls (Right) -->
      <g transform="translate(760, 24)">
        <rect width="64" height="32" rx="6" fill="#202532" stroke="#2F3647"/>
        <text x="18" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38BDF8">1.5x</text>

        <rect x="74" y="0" width="110" height="32" rx="6" fill="#252A36" stroke="#363E52"/>
        <text x="88" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0F3F6">Export MP3</text>
      </g>
    </g>

    <!-- Recordings Library Table -->
    <g id="tblAudioFiles" transform="translate(0, 174)">
      <rect width="970" height="490" rx="12" fill="#14171E" stroke="#1F232B" stroke-width="1"/>
      <text x="24" y="36" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#F0F3F6">Recorded Lectures Library</text>

      <!-- Table Header -->
      <g transform="translate(24, 60)">
        <rect width="922" height="36" rx="6" fill="#1A1E27"/>
        <text x="20" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#717886">LECTURE TITLE</text>
        <text x="420" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#717886">DATE &amp; TIME</text>
        <text x="600" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#717886">DURATION</text>
        <text x="720" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#717886">SYNC STATUS</text>
        <text x="840" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#717886">ACTIONS</text>
      </g>

      <!-- Row 1: Playing -->
      <g transform="translate(24, 106)">
        <rect width="922" height="56" rx="8" fill="#1C212D" stroke="#38BDF8" stroke-width="1.2"/>
        <circle cx="28" cy="28" r="14" fill="#38BDF8"/>
        <path d="M25 21L33 28L25 35V21Z" fill="#0E1015"/>
        <text x="54" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Kotlin Multiplatform Concurrency &amp; StateFlow</text>
        <text x="54" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#7DD3FC">Now Playing · Audio Waveform active</text>
        <text x="420" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#8A92A2">Today, 10:14 AM</text>
        <text x="600" y="34" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F0F3F6">01:14:20</text>
        <rect x="720" y="16" width="94" height="24" rx="4" fill="rgba(54, 211, 153, 0.15)"/>
        <text x="730" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#36D399">✓ Synced</text>
        <text x="840" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Pause</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(24, 172)">
        <rect width="922" height="56" rx="8" fill="#161922"/>
        <circle cx="28" cy="28" r="14" fill="#252A36"/>
        <path d="M25 21L33 28L25 35V21Z" fill="#C5CAD3"/>
        <text x="54" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">JavaFX MVC Architecture &amp; Scene Builder FXML</text>
        <text x="54" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#717886">14 Flashcards generated</text>
        <text x="420" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#8A92A2">Yesterday, 09:00 AM</text>
        <text x="600" y="34" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F0F3F6">00:54:10</text>
        <rect x="720" y="16" width="94" height="24" rx="4" fill="rgba(54, 211, 153, 0.15)"/>
        <text x="730" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#36D399">✓ Synced</text>
        <text x="840" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8A92A2">Play</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(24, 238)">
        <rect width="922" height="56" rx="8" fill="#161922"/>
        <circle cx="28" cy="28" r="14" fill="#252A36"/>
        <path d="M25 21L33 28L25 35V21Z" fill="#C5CAD3"/>
        <text x="54" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">SQLite Database Persistence &amp; Spaced Repetition (SM-2)</text>
        <text x="54" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#717886">22 Flashcards generated</text>
        <text x="420" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#8A92A2">10 Nov 2026, 11:30 AM</text>
        <text x="600" y="34" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F0F3F6">01:05:45</text>
        <rect x="720" y="16" width="94" height="24" rx="4" fill="rgba(54, 211, 153, 0.15)"/>
        <text x="730" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#36D399">✓ Synced</text>
        <text x="840" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8A92A2">Play</text>
      </g>
    </g>

  </g>
</svg>
