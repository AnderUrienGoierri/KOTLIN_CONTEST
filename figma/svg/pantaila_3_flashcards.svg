<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvasGradStudy" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="50%" stop-color="#14171E"/>
      <stop offset="100%" stop-color="#0D0F13"/>
    </linearGradient>

    <linearGradient id="brandLinearStudy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>

    <linearGradient id="cardSurfaceStudy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E222B"/>
      <stop offset="100%" stop-color="#161920"/>
    </linearGradient>

    <linearGradient id="cardBorderStudy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>

    <linearGradient id="primaryBtnGradStudy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#6B3AE8"/>
    </linearGradient>

    <filter id="cardElevationStudy" x="-20" y="-10" width="760" height="480" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7F52FF" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect id="bgBase" width="1280" height="800" fill="url(#bgCanvasGradStudy)"/>

  <!-- Left Sidebar (JetBrains Int UI Style) -->
  <g id="sidebarContainer">
    <rect width="250" height="800" fill="#111317" stroke="#1F232B" stroke-width="1"/>
    
    <!-- Brand Header -->
    <g id="brandHeader" transform="translate(18, 20)">
      <rect width="36" height="36" rx="10" fill="url(#brandLinearStudy)"/>
      <path d="M14 11L22 18L14 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F0F3F6">LectureSync</text>
      <rect x="135" y="6" width="34" height="18" rx="4" fill="rgba(127, 82, 255, 0.2)"/>
      <text x="142" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#B388FF">AI</text>
      <text x="48" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#717886">Int UI · Study Hub</text>
    </g>

    <!-- Quick Search -->
    <g id="sidebarSearch" transform="translate(14, 76)">
      <rect width="222" height="32" rx="6" fill="#181B22" stroke="#252A35" stroke-width="1"/>
      <circle cx="26" cy="16" r="4.5" stroke="#717886" stroke-width="1.3"/>
      <path d="M29.5 19.5L33 23" stroke="#717886" stroke-width="1.3" stroke-linecap="round"/>
      <text x="42" y="20" font-family="'Inter', sans-serif" font-size="12" fill="#717886">Filter decks (⌘K)...</text>
    </g>

    <!-- Navigation Items -->
    <g id="navGroup" transform="translate(14, 126)">
      <text x="8" y="10" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="0.8" fill="#505663">WORKSPACE</text>

      <!-- Nav: Dashboard -->
      <g id="btnNavDashboard" transform="translate(0, 20)">
        <rect width="222" height="36" rx="8" fill="transparent"/>
        <path d="M16 11H20V15H16V11ZM16 17H20V21H16V17ZM22 11H26V15H22V11ZM22 17H26V21H22V17Z" stroke="#8A92A2" stroke-width="1.6"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Dashboard</text>
      </g>

      <!-- Nav: Live Studio -->
      <g id="btnNavLive" transform="translate(0, 60)">
        <rect width="222" height="36" rx="8" fill="transparent"/>
        <path d="M18 12C16.3 12 15 13.3 15 15V21C15 22.7 16.3 24 18 24C19.7 24 21 22.7 21 21V15C21 13.3 19.7 12 18 12Z" stroke="#8A92A2" stroke-width="1.6"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Live Studio</text>
      </g>

      <!-- Active: Flashcards & Quizzes -->
      <g id="btnNavFlashcards" transform="translate(0, 100)">
        <rect width="222" height="36" rx="8" fill="rgba(127, 82, 255, 0.12)" stroke="rgba(127, 82, 255, 0.25)"/>
        <rect x="0" y="8" width="3" height="20" rx="1.5" fill="#7F52FF"/>
        <rect x="14" y="14" width="14" height="14" rx="2" stroke="#B388FF" stroke-width="1.8"/>
        <rect x="18" y="10" width="14" height="14" rx="2" stroke="#B388FF" stroke-width="1.8" stroke-dasharray="2 2"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Flashcards &amp; Quizzes</text>
      </g>

      <!-- Nav: Mind Maps -->
      <g id="btnNavMindMaps" transform="translate(0, 140)">
        <rect width="222" height="36" rx="8" fill="transparent"/>
        <circle cx="16" cy="18" r="2.5" fill="#8A92A2"/>
        <circle cx="26" cy="12" r="2.5" fill="#8A92A2"/>
        <circle cx="26" cy="24" r="2.5" fill="#8A92A2"/>
        <line x1="18.5" y1="16.5" x2="23.5" y2="13.5" stroke="#8A92A2" stroke-width="1.4"/>
        <line x1="18.5" y1="19.5" x2="23.5" y2="22.5" stroke="#8A92A2" stroke-width="1.4"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Concept Maps</text>
      </g>

      <!-- Nav: Settings -->
      <g id="btnNavSettings" transform="translate(0, 180)">
        <rect width="222" height="36" rx="8" fill="transparent"/>
        <circle cx="21" cy="18" r="3" stroke="#8A92A2" stroke-width="1.6"/>
        <path d="M21 11V13M21 23V25M14 18H16M26 18H28" stroke="#8A92A2" stroke-width="1.6" stroke-linecap="round"/>
        <text x="38" y="23" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Settings &amp; AI Config</text>
      </g>
    </g>

    <!-- Sidebar Footer / Sync Status -->
    <g id="sidebarFooter" transform="translate(14, 730)">
      <rect width="222" height="52" rx="8" fill="#161920" stroke="#222631" stroke-width="1"/>
      <rect x="10" y="10" width="32" height="32" rx="16" fill="#2B303C"/>
      <text x="21" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#B388FF">SM</text>
      <circle cx="36" cy="36" r="4" fill="#36D399" stroke="#161920" stroke-width="1.5"/>
      <text x="50" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0F3F6">SuperMemo SM-2</text>
      <text x="50" y="37" font-family="'Inter', sans-serif" font-size="10" fill="#717886">Retention rate: 94.2%</text>
    </g>
  </g>

  <!-- Top Navigation & Breadcrumbs Bar -->
  <g id="topBar" transform="translate(250, 0)">
    <rect width="1030" height="64" fill="#111317" stroke="#1F232B" stroke-width="1"/>
    
    <g transform="translate(28, 23)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Decks</text>
      <text x="44" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#505663">/</text>
      <text x="58" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#8A92A2">Distributed Systems</text>
      <text x="194" y="0" font-family="'Inter', sans-serif" font-size="13" fill="#505663">/</text>
      <text x="208" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Kotlin Concurrency (Box 2)</text>
    </g>

    <!-- Top Right Deck Controls -->
    <g transform="translate(740, 14)">
      <!-- Deck Mode Selector -->
      <rect width="140" height="36" rx="6" fill="#181B22" stroke="#252A35"/>
      <text x="14" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#C5CAD3">Exam Cram Mode</text>

      <!-- Edit Deck / Add Card -->
      <g id="btnNewCard" transform="translate(152, 0)">
        <rect width="120" height="36" rx="6" fill="#222733" stroke="#32384A"/>
        <text x="24" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">+ Add Card</text>
      </g>
    </g>
  </g>

  <!-- Study Workspace Content -->
  <g id="mainContent" transform="translate(280, 84)">
    
    <!-- Top Deck Summary Header -->
    <g id="deckStatsHeader">
      <rect width="970" height="60" rx="10" fill="#161920" stroke="#222631" stroke-width="1"/>
      
      <!-- Deck Progress Status -->
      <g transform="translate(24, 18)">
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F0F3F6">Card 4 of 18</text>
        <rect x="95" y="6" width="60" height="18" rx="4" fill="rgba(54, 211, 153, 0.15)"/>
        <text x="103" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#36D399">BOX 2 / 5</text>
      </g>

      <!-- Session Progress Bar -->
      <g transform="translate(240, 24)">
        <rect width="420" height="10" rx="5" fill="#252A35"/>
        <rect width="168" height="10" rx="5" fill="url(#brandLinearStudy)"/>
        <text x="432" y="10" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#A0A8B7">38% Done (14 Left)</text>
      </g>

      <!-- Quick Session Controls -->
      <g transform="translate(840, 16)">
        <rect width="104" height="28" rx="6" fill="#1F2430" stroke="#2E3547"/>
        <text x="14" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#8A92A2">Shuffle: ON</text>
      </g>
    </g>

    <!-- Center Interactive 3D Study Card Area -->
    <g id="flashcardStudyArea" transform="translate(130, 84)">
      
      <!-- Main Flip Card Container with Shadow & Glow -->
      <g id="cardFlipContainer" filter="url(#cardElevationStudy)">
        <rect width="710" height="420" rx="16" fill="url(#cardSurfaceStudy)" stroke="url(#cardBorderStudy)" stroke-width="1.5"/>

        <!-- Card Top Bar: Badges & Tags -->
        <g id="cardHeader" transform="translate(32, 28)">
          <rect width="110" height="24" rx="6" fill="rgba(127, 82, 255, 0.2)" stroke="rgba(127, 82, 255, 0.3)"/>
          <text x="12" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C09CFF">KMP Concurrency</text>

          <rect x="122" y="0" width="80" height="24" rx="6" fill="#222733"/>
          <text x="134" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#8A92A2">High Yield</text>

          <g transform="translate(560, 4)">
            <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#6B7385">Next: 3 days</text>
          </g>
        </g>

        <!-- Question Section -->
        <g id="txtCardQuestion" transform="translate(48, 120)">
          <text x="0" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#7F52FF">QUESTION</text>
          
          <text x="0" y="70" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" line-height="36">
            What does <tspan fill="#38BDF8">`Dispatchers.JavaFx`</tspan> guarantee
          </text>
          <text x="0" y="112" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" line-height="36">
            in a Desktop Kotlin Multiplatform app?
          </text>

          <!-- Context Pill -->
          <g transform="translate(0, 150)">
            <rect width="450" height="34" rx="6" fill="#14171E" stroke="#252A35"/>
            <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9DA5B4">Context: kotlinx-coroutines-javafx UI thread safety</text>
          </g>
        </g>

        <!-- Flip Trigger Button (Interactive State) -->
        <g id="btnFlipCard" transform="translate(235, 340)">
          <rect width="240" height="46" rx="8" fill="#252A36" stroke="#363E52" stroke-width="1"/>
          <path d="M42 23C42 18.5 45.6 15 50.1 15C53.4 15 56.3 17 57.5 20M58 23C58 27.5 54.4 31 49.9 31C46.6 31 43.7 29 42.5 26" stroke="#B388FF" stroke-width="2" stroke-linecap="round"/>
          <text x="68" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F0F3F6">Tap or Space to Flip</text>
          <rect x="186" y="14" width="38" height="18" rx="3" fill="#181B22"/>
          <text x="191" y="27" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#717886">SPACE</text>
        </g>
      </g>

      <!-- SuperMemo SM-2 Evaluation Buttons (Revealed State) -->
      <g id="pnlAnswerActions" transform="translate(0, 470)">
        
        <!-- Button: Again (1 min) -->
        <g id="btnMarkAgain" transform="translate(0, 0)">
          <rect width="165" height="52" rx="10" fill="#20181A" stroke="#482229" stroke-width="1.2"/>
          <circle cx="28" cy="26" r="10" fill="#E06C75" fill-opacity="0.2"/>
          <text x="24" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E06C75">1</text>
          <text x="48" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FF8E99">Again</text>
          <text x="48" y="39" font-family="'Inter', sans-serif" font-size="11" fill="#A8616B">&lt; 1 min</text>
        </g>

        <!-- Button: Hard (1 day) -->
        <g id="btnMarkHard" transform="translate(182, 0)">
          <rect width="165" height="52" rx="10" fill="#221D16" stroke="#4A3B22" stroke-width="1.2"/>
          <circle cx="28" cy="26" r="10" fill="#E5C07B" fill-opacity="0.2"/>
          <text x="24" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E5C07B">2</text>
          <text x="48" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFDE99">Hard</text>
          <text x="48" y="39" font-family="'Inter', sans-serif" font-size="11" fill="#998150">1 day</text>
        </g>

        <!-- Button: Good (3 days) - Recommended Default -->
        <g id="btnMarkGood" transform="translate(364, 0)">
          <rect width="165" height="52" rx="10" fill="#152132" stroke="#254B78" stroke-width="1.5"/>
          <circle cx="28" cy="26" r="10" fill="#3574F0" fill-opacity="0.2"/>
          <text x="24" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">3</text>
          <text x="48" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#70B4FF">Good</text>
          <text x="48" y="39" font-family="'Inter', sans-serif" font-size="11" fill="#4B7DBA">3 days (SM-2)</text>
        </g>

        <!-- Button: Easy (7 days) -->
        <g id="btnMarkEasy" transform="translate(545, 0)">
          <rect width="165" height="52" rx="10" fill="#14241D" stroke="#22533D" stroke-width="1.2"/>
          <circle cx="28" cy="26" r="10" fill="#36D399" fill-opacity="0.2"/>
          <text x="24" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#36D399">4</text>
          <text x="48" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">Easy</text>
          <text x="48" y="39" font-family="'Inter', sans-serif" font-size="11" fill="#3E8668">7 days</text>
        </g>
      </g>

      <!-- Keyboard shortcuts legend -->
      <g transform="translate(195, 546)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#6B7385">Keyboard hotkeys: [Space] Flip card · [1] Again · [2] Hard · [3] Good · [4] Easy</text>
      </g>
    </g>

    <!-- Right Side Study Info Column -->
    <g id="pnlStudyStats" transform="translate(860, 84)">
      <rect width="210" height="530" rx="12" fill="#161920" stroke="#222631" stroke-width="1"/>
      <text x="18" y="32" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F0F3F6">SuperMemo Stats</text>

      <!-- Metric 1: Retention -->
      <g transform="translate(18, 56)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#717886">RETENTION INDEX</text>
        <text x="0" y="36" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#36D399">94.2%</text>
        <rect x="0" y="46" width="174" height="6" rx="3" fill="#252A35"/>
        <rect x="0" y="46" width="164" height="6" rx="3" fill="#36D399"/>
      </g>

      <!-- Metric 2: Today's Due -->
      <g transform="translate(18, 130)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#717886">REVIEWS TODAY</text>
        <text x="0" y="36" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#F0F3F6">14 <tspan font-size="13" font-weight="500" fill="#717886">cards</tspan></text>
      </g>

      <!-- Metric 3: Interval Factor -->
      <g transform="translate(18, 196)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#717886">E-FACTOR (EASE)</text>
        <text x="0" y="36" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#B388FF">2.50 <tspan font-size="11" font-weight="500" fill="#717886">(optimal)</tspan></text>
      </g>

      <!-- Divider -->
      <line x1="18" y1="260" x2="192" y2="260" stroke="#222631"/>

      <!-- Leitner Boxes Breakdown -->
      <g transform="translate(18, 280)">
        <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8A92A2">LEITNER BOXES</text>

        <g transform="translate(0, 26)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#C5CAD3">Box 1 (Daily)</text>
          <text x="150" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F0F3F6">4</text>
        </g>
        <g transform="translate(0, 50)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#B388FF">Box 2 (3d - Active)</text>
          <text x="150" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#B388FF">18</text>
        </g>
        <g transform="translate(0, 74)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#C5CAD3">Box 3 (1 wk)</text>
          <text x="150" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F0F3F6">42</text>
        </g>
        <g transform="translate(0, 98)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#C5CAD3">Box 4 (2 wks)</text>
          <text x="150" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#F0F3F6">56</text>
        </g>
        <g transform="translate(0, 122)">
          <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#C5CAD3">Box 5 (Mastered)</text>
          <text x="150" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#36D399">22</text>
        </g>
      </g>
    </g>

  </g>
</svg>
