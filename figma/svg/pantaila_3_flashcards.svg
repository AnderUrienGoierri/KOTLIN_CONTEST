<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: 'Segoe UI', 'Inter', sans-serif; font-size: 16px; font-weight: bold; fill: #F0F3F6; }
      .font-sub { font-family: 'Segoe UI', 'Inter', sans-serif; font-size: 13px; fill: #9DA5B4; }
      .font-btn { font-family: 'Segoe UI', 'Inter', sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; }
    </style>
  </defs>

  <rect id="bgBase" width="1280" height="800" fill="#181A1F"/>

  <!-- Left Sidebar -->
  <g id="sidebarContainer">
    <rect width="260" height="800" fill="#14161A" stroke="#2E333D" stroke-width="1"/>
    <text x="20" y="44" class="font-title">LectureSync AI</text>
    <g id="btnNavFlashcards" transform="translate(12, 138)">
      <rect width="236" height="40" rx="6" fill="rgba(127, 82, 255, 0.15)"/>
      <rect width="4" height="40" fill="#7F52FF"/>
      <text x="18" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#B388FF">Flashcards &amp; Quizzes</text>
    </g>
  </g>

  <!-- Top Bar -->
  <g id="topBar" transform="translate(260, 0)">
    <rect width="1020" height="64" fill="#181A1F" stroke="#2E333D" stroke-width="1"/>
    <text x="28" y="37" font-family="sans-serif" font-size="13" fill="#9DA5B4">Study Mode / <tspan font-weight="bold" fill="#F0F3F6">Distributed Systems Deck (Leitner Box 2)</tspan></text>
  </g>

  <!-- Center Card Area -->
  <g id="flashcardStudyArea" transform="translate(460, 140)">
    <!-- Main Interactive Card -->
    <g id="cardFlipContainer">
      <rect width="620" height="380" rx="12" fill="#21252B" stroke="#2E333D"/>
      <rect x="24" y="24" width="90" height="24" rx="4" fill="rgba(127, 82, 255, 0.2)"/>
      <text x="36" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B388FF">Card 4 of 18</text>

      <!-- Question Text -->
      <g id="txtCardQuestion" transform="translate(24, 90)">
        <text x="0" y="30" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F0F3F6">What does `Dispatchers.JavaFx`</text>
        <text x="0" y="65" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F0F3F6">guarantee in a Desktop KMP app?</text>
      </g>

      <!-- Answer Hidden Hint / Button -->
      <g id="btnFlipCard" transform="translate(210, 290)">
        <rect width="200" height="44" rx="6" fill="#30353E" stroke="#3E4451"/>
        <text x="38" y="27" class="font-btn">Tap or Space to Flip</text>
      </g>
    </g>

    <!-- Response Buttons -->
    <g id="pnlAnswerActions" transform="translate(0, 420)">
      <!-- Again / Difficult Button -->
      <g id="btnMarkReview">
        <rect width="180" height="48" rx="8" fill="#E06C75"/>
        <text x="50" y="30" class="font-btn">Review (1d)</text>
      </g>
      <!-- Good Button -->
      <g id="btnMarkGood" transform="translate(220, 0)">
        <rect width="180" height="48" rx="8" fill="#3574F0"/>
        <text x="60" y="30" class="font-btn">Good (3d)</text>
      </g>
      <!-- Easy / Mastered Button -->
      <g id="btnMarkKnown" transform="translate(440, 0)">
        <rect width="180" height="48" rx="8" fill="#28A745"/>
        <text x="60" y="30" class="font-btn">Easy (7d)</text>
      </g>
    </g>

    <!-- Progress Bar -->
    <g id="prgMastery" transform="translate(0, 500)">
      <rect width="620" height="8" rx="4" fill="#2E333D"/>
      <rect width="240" height="8" rx="4" fill="#7F52FF"/>
      <text x="0" y="28" class="font-sub">Session Progress: 38% completed</text>
    </g>
  </g>
</svg>
