<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: 'Segoe UI', 'Inter', sans-serif; font-size: 18px; font-weight: bold; fill: #F0F3F6; }
      .font-sub { font-family: 'Segoe UI', 'Inter', sans-serif; font-size: 12px; fill: #9DA5B4; }
      .font-btn { font-family: 'Segoe UI', 'Inter', sans-serif; font-size: 14px; font-weight: bold; fill: #FFFFFF; }
    </style>
  </defs>

  <rect id="bgMobileBase" width="390" height="844" rx="40" fill="#181A1F" stroke="#2E333D" stroke-width="4"/>
  <rect id="mobileNotch" x="135" y="14" width="120" height="28" rx="14" fill="#000000"/>

  <!-- Top Bar -->
  <g id="mobileTopBar" transform="translate(24, 60)">
    <text x="0" y="22" class="font-title">Quick Review</text>
    <text x="0" y="40" class="font-sub">Distributed Systems Deck (Leitner Box 2)</text>
  </g>

  <!-- Mobile Flashcard -->
  <g id="cardMobileStudy" transform="translate(24, 130)">
    <rect width="342" height="420" rx="20" fill="#21252B" stroke="#2E333D"/>
    
    <rect x="20" y="24" width="80" height="22" rx="4" fill="rgba(127, 82, 255, 0.2)"/>
    <text x="28" y="39" font-family="sans-serif" font-size="10" font-weight="bold" fill="#B388FF">Card 4 / 18</text>

    <!-- Question -->
    <text x="20" y="100" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F0F3F6">What does</text>
    <text x="20" y="126" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F0F3F6">`Dispatchers.JavaFx`</text>
    <text x="20" y="152" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F0F3F6">guarantee in KMP?</text>

    <!-- Flip Button -->
    <g id="btnMobileFlip" transform="translate(20, 340)">
      <rect width="302" height="48" rx="10" fill="#30353E" stroke="#3E4451"/>
      <text x="100" y="29" class="font-btn">Tap to Reveal Answer</text>
    </g>
  </g>

  <!-- Response Rating Buttons -->
  <g id="mobileRatingButtons" transform="translate(24, 576)">
    <g id="btnReviewAgain">
      <rect width="106" height="50" rx="10" fill="#E06C75"/>
      <text x="20" y="30" class="font-btn">Hard (1d)</text>
    </g>
    <g id="btnReviewGood" transform="translate(118, 0)">
      <rect width="106" height="50" rx="10" fill="#3574F0"/>
      <text x="18" y="30" class="font-btn">Good (3d)</text>
    </g>
    <g id="btnReviewEasy" transform="translate(236, 0)">
      <rect width="106" height="50" rx="10" fill="#28A745"/>
      <text x="20" y="30" class="font-btn">Easy (7d)</text>
    </g>
  </g>

  <!-- Progress Bar -->
  <g id="mobileProgress" transform="translate(24, 650)">
    <rect width="342" height="6" rx="3" fill="#2E333D"/>
    <rect width="130" height="6" rx="3" fill="#7F52FF"/>
    <text x="0" y="24" class="font-sub">Daily streak: 4 days (38% done)</text>
  </g>

  <rect x="125" y="826" width="140" height="4" rx="2" fill="#FFFFFF"/>
</svg>
